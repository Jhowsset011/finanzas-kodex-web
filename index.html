<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Finanzas KODEX</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- ============ LOGIN ============ -->
  <section id="view-login" class="view">
    <div class="login-wrap">
      <div class="brand">
        <div class="brand-mark">KX</div>
        <h1>FINANZAS <span>KODEX</span></h1>
        <p class="brand-sub">Control de ventas</p>
      </div>
      <form id="login-form" autocomplete="off">
        <label class="field">
          <span>Usuario</span>
          <input type="text" id="login-user" placeholder="tu usuario" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Contraseña</span>
          <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" required>
        </label>
        <p id="login-error" class="error hidden"></p>
        <button type="submit" id="login-btn" class="btn btn-primary btn-block">Entrar</button>
      </form>
    </div>
  </section>

  <!-- ============ APP ============ -->
  <div id="view-main" class="view hidden">
    <header class="topbar">
      <div class="topbar-id">
        <div class="brand-mark sm">KX</div>
        <div>
          <div class="topbar-name" id="user-name">—</div>
          <div class="topbar-role" id="user-role">—</div>
        </div>
      </div>
      <button id="logout-btn" class="btn btn-ghost">Salir</button>
    </header>

    <main id="main-content">
      <!-- Vendedor -->
      <section id="tab-registrar" class="tab hidden">
        <h2>Registrar venta</h2>
        <div class="card">
          <label class="field">
            <span>Producto</span>
            <input type="text" id="sale-product-search" placeholder="Buscar producto…" autocomplete="off">
            <div id="product-results" class="autocomplete hidden"></div>
          </label>
          <div id="product-selected" class="selected-product hidden">
            <div class="sp-name" id="sp-name"></div>
            <div class="sp-cost">Costo: <strong id="sp-cost"></strong></div>
            <button type="button" id="product-clear" class="btn btn-ghost btn-xs">Cambiar</button>
          </div>
          <div class="row2">
            <label class="field">
              <span>Cantidad</span>
              <input type="number" id="sale-qty" value="1" min="1" step="1" inputmode="numeric">
            </label>
            <label class="field">
              <span>Precio de venta (RD$)</span>
              <input type="number" id="sale-price" placeholder="0" min="0" step="1" inputmode="decimal">
            </label>
          </div>
          <div class="row2">
            <label class="field">
              <span>Envío (RD$)</span>
              <input type="number" id="sale-ship" value="0" min="0" step="1" inputmode="decimal">
            </label>
            <label class="field">
              <span>Fecha</span>
              <input type="date" id="sale-date">
            </label>
          </div>
          <label class="field">
            <span>Descripción (opcional)</span>
            <input type="text" id="sale-desc" placeholder="Nota…" maxlength="200">
          </label>
          <div id="sale-preview" class="preview">
            <span>Tu parte (50%)</span>
            <strong id="sale-preview-value">—</strong>
          </div>
          <p id="sale-error" class="error hidden"></p>
          <button id="sale-save" class="btn btn-primary btn-block">Guardar venta</button>
        </div>
      </section>

      <section id="tab-misventas" class="tab hidden">
        <h2>Mis ventas</h2>
        <div class="month-nav">
          <button id="mv-prev" class="btn btn-ghost">‹</button>
          <span id="mv-month-label"></span>
          <button id="mv-next" class="btn btn-ghost">›</button>
        </div>
        <div id="my-sales-list" class="list"></div>
      </section>

      <section id="tab-resumen" class="tab hidden">
        <h2>Mi resumen</h2>
        <div class="month-nav">
          <button id="rs-prev" class="btn btn-ghost">‹</button>
          <span id="rs-month-label"></span>
          <button id="rs-next" class="btn btn-ghost">›</button>
        </div>
        <div class="stats">
          <div class="stat card"><span class="stat-label">Total vendido</span><strong id="rs-total" class="stat-value">—</strong></div>
          <div class="stat card"><span class="stat-label">Mi parte (50%)</span><strong id="rs-share" class="stat-value accent">—</strong></div>
          <div class="stat card"><span class="stat-label">Ventas</span><strong id="rs-count" class="stat-value">—</strong></div>
        </div>
      </section>

      <!-- Dueño -->
      <section id="tab-ventas" class="tab hidden">
        <h2>Ventas</h2>
        <div class="filters card">
          <div class="month-nav">
            <button id="ow-prev" class="btn btn-ghost">‹</button>
            <span id="ow-month-label"></span>
            <button id="ow-next" class="btn btn-ghost">›</button>
          </div>
          <label class="field">
            <span>Vendedor</span>
            <select id="ow-seller-filter">
              <option value="">Todos</option>
            </select>
          </label>
        </div>
        <div id="owner-sales-list" class="list"></div>
      </section>

      <section id="tab-vendedores" class="tab hidden">
        <h2>Vendedores</h2>
        <div class="month-nav">
          <button id="sl-prev" class="btn btn-ghost">‹</button>
          <span id="sl-month-label"></span>
          <button id="sl-next" class="btn btn-ghost">›</button>
        </div>
        <div id="sellers-summary" class="list"></div>
        <div class="card" id="owner-net-card">
          <div class="kv"><span>Publicidad del mes</span><strong id="sl-ad"></strong></div>
          <div class="kv total"><span>Mi neto total (dueño)</span><strong id="sl-net" class="accent"></strong></div>
        </div>
      </section>

      <section id="tab-publicidad" class="tab hidden">
        <h2>Publicidad</h2>
        <div class="card">
          <div class="row2">
            <label class="field">
              <span>Fecha</span>
              <input type="date" id="ad-date">
            </label>
            <label class="field">
              <span>Monto (RD$)</span>
              <input type="number" id="ad-amount" placeholder="0" min="0" step="1" inputmode="decimal">
            </label>
          </div>
          <p id="ad-error" class="error hidden"></p>
          <button id="ad-save" class="btn btn-primary btn-block">Guardar gasto</button>
        </div>
        <h3>Últimos registros</h3>
        <div id="ad-list" class="list"></div>
      </section>

      <section id="tab-productos" class="tab hidden">
        <h2>Productos</h2>
        <label class="field">
          <span>Buscar</span>
          <input type="text" id="prod-search" placeholder="Nombre o referencia…" autocomplete="off">
        </label>
        <div id="prod-count" class="muted"></div>
        <div id="prod-list" class="list"></div>
      </section>
    </main>

    <nav id="bottomnav" class="bottomnav"></nav>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
